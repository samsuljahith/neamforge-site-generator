version: "3.8"

services:
  # Ollama — local LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: sitegen-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]    # optional — remove if no GPU

  # Pull the model on first run
  ollama-setup:
    image: ollama/ollama:latest
    container_name: sitegen-ollama-setup
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull llama3.1 &&
        echo 'Model ready!'
      "
    environment:
      - OLLAMA_HOST=ollama:11434

  # NeamForge Site Generator
  site-generator:
    build: .
    container_name: sitegen-forge
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - site_workspace:/home/neam/workspace
      # Mount a custom site spec (optional — uses default if not mounted)
      # - ./my-custom-spec.json:/home/neam/site-spec.json

  # Simple HTTP server to preview the generated site
  preview:
    image: nginx:alpine
    container_name: sitegen-preview
    depends_on:
      - site-generator
    ports:
      - "3000:80"
    volumes:
      - site_workspace:/usr/share/nginx/html/output:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ollama_data:
  site_workspace:
