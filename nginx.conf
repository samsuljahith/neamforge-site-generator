server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/output;
    index index.html;

    # Try files, then directory, then 404 page
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Custom error page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
